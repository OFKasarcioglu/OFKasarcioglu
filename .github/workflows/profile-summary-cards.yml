name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 3 * * *"   # her gün 03:00 UTC'de günceller
  workflow_dispatch:       # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # SUMMARY_GITHUB_TOKEN (PAT) varsa onu, yoksa varsayılan token'ı kullanır.
          # Özel repo katkılarının da sayılması için PAT eklemen önerilir.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 3
