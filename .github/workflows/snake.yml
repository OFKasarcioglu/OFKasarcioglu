name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # günde iki kez günceller
  workflow_dispatch:        # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0039C6&color_dots=#ebedf0,#b6d4ff,#6ea8ff,#0A6EFF,#00288F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161b22,#0b2a66,#0039C6,#0A6EFF,#58A6FF

      # Üretilen SVG'leri "output" dalına yayınlar (README buradan okur)
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
